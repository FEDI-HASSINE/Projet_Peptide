# configs/transformer_base.yaml — Configuration Transformer causal (Semaine 3 / T49)
# Yassine : configs versionnées ; Youssef : modèle Transformer from scratch.

model: transformer

# --- Vocabulaire & séquences ---
vocab_size: 23        # PAD=0, BOS=1, EOS=2, 20 AA (peplib.tokenizer)
max_len: 52           # 50 résidus + BOS + EOS (convention semaine 2)
pad_id: 0
bos_id: 1
eos_id: 2

# --- Architecture ---
embed_dim: 128
n_heads: 4
n_layers: 4
ffn_dim: 256
dropout: 0.1

# --- Entraînement ---
batch_size: 64
lr: 0.001
warmup_steps: 200     # warmup linéaire (plan de repli si NaN)
max_epochs: 30
patience: 5           # early stopping sur val_loss
grad_clip: 1.0
label_ignore_index: -100

# --- Chemins ---
splits_dir: data/processed/splits
checkpoints_dir: checkpoints/transformer
results_dir: results/week3
