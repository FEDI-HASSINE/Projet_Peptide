# configs/lstm_base.yaml — LSTM causal, semaine 3 (T52/T53)
# Schema imbrique (harmonise avec PR #24, Yassine)

model:
  type: lstm
  vocab_size: 23        # PAD=0, BOS=1, EOS=2, 20 AA
  d_embed: 128
  d_hidden: 256
  n_layers: 2
  dropout: 0.2
  tie_weights: false

train:
  seed: 42
  batch_size: 128
  max_epochs: 30
  optimizer: adamw
  lr: 0.001
  weight_decay: 0.01
  grad_clip: 1.0
  early_stopping:
    metric: val_ppl
    patience: 5

data:
  train: data/splits/train_v02.csv
  val:   data/splits/val_v02.csv
  max_len: 50

checkpoints_dir: checkpoints/lstm
results_dir: results/week3

sampling_grid:
  temperature: [0.8, 1.0, 1.2]
  top_k: [0, 10]
  top_p: [1.0, 0.9]
