# configs/lstm_base.yaml — Configuration LSTM causal (Semaine 3 / T49)
# Schema imbriqué (validé par peplib/config.py)

model:
  type: lstm
  vocab_size: 23
  d_embed: 128
  d_hidden: 256
  n_layers: 2
  dropout: 0.2
  tie_weights: false

train:
  seed: 42
  batch_size: 128
  max_epochs: 30
  optimizer: adamw
  lr: 0.001
  weight_decay: 0.01
  grad_clip: 1.0
  early_stopping:
    metric: val_ppl
    patience: 3

data:
  train: data/splits/train_v02.csv
  val: data/splits/val_v02.csv
  max_len: 50

sampling_grid:
  temperature: [0.8, 1.0, 1.2]
  top_k: [0, 10]
  top_p: [1.0, 0.9]